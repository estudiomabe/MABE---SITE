<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; display: flex; background: #e8e6e1; font-family: 'Inter', sans-serif; }
  .foto { width: 46%; height: 100%; object-fit: cover; display: block; }
  .texto {
    flex: 1; padding: 0 5rem;
    display: flex; flex-direction: column; justify-content: center;
    border-left: 1px solid #c8c5be;
  }
  .overline {
    font-size: 0.82rem; font-weight: 500; letter-spacing: 0.24em;
    text-transform: uppercase; color: #7a7874; margin-bottom: 2rem;
  }
  h1 {
    font-family: 'Cormorant Garamond', serif; font-weight: 300;
    font-size: 3.6rem; line-height: 1.12; letter-spacing: -0.01em;
    color: #111110; margin-bottom: 2rem;
  }
  h1 em { font-style: italic; color: #7a7874; }
  .divider { width: 60px; height: 1px; background: #c8c5be; margin-bottom: 2rem; }
  .marca { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 1.5rem; color: #111110; }
  .local { font-size: 0.78rem; letter-spacing: 0.18em; text-transform: uppercase; color: #b89a58; margin-top: 0.6rem; }
</style>
</head>
<body>
  <img class="foto" src="images/criado-botafogo.jpg" alt="" />
  <div class="texto">
    <p class="overline">Design autoral brasileiro</p>
    <h1>Design que dialoga<br>com o <em>seu ambiente.</em></h1>
    <div class="divider"></div>
    <p class="marca">estúdio mabe.</p>
    <p class="local">Marcenaria em madeira maciça · Rio de Janeiro</p>
  </div>
</body>
</html>
