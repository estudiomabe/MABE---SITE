<!doctype html>
<meta charset="utf-8">
<title>Recorte 4:5</title>
<!--
  Recorta uma foto em 4:5, redimensiona para 924x1155 e grava em WebP,
  que e o padrao de todas as fotos de projeto do site.

  Como usar:
  1. copie a foto para a raiz do projeto com o nome _entrada.jpg
  2. node gerar-cartoes-servidor.js
  3. abra http://localhost:8801/recortar-foto.html?nome=trabalho-ALGO-1&x=0&y=0.3&l=0.84
  4. confira a moldura amarela na miniatura e o resultado ao lado

  Parametros do endereco (todos opcionais, em fracao da imagem):
     nome  nome do arquivo final, sem extensao (precisa comecar com trabalho-)
     x     canto esquerdo do recorte          (0 = colado na esquerda)
     y     topo do recorte                    (0 = colado no topo)
     l     largura do recorte                 (1 = largura inteira)
-->
<style>
  body { font-family: system-ui, sans-serif; background: #222; color: #eee; padding: 20px; }
  #log { white-space: pre-wrap; font-family: monospace; font-size: 12px; line-height: 1.7; }
  canvas { width: 370px; height: auto; display: block; border: 1px solid #555; }
  #guia { position: relative; display: inline-block; margin-right: 24px; }
  #guia img { width: 300px; display: block; }
  #moldura { position: absolute; border: 2px solid #ffcc33; box-sizing: border-box; }
  .lado { display: flex; align-items: flex-start; margin-top: 14px; }
</style>
<div id="log">carregando…</div>
<div class="lado">
  <div id="guia"><img id="fonte" src="/_entrada.jpg" alt=""><div id="moldura"></div></div>
  <canvas id="saida"></canvas>
</div>

<script>
const p = new URLSearchParams(location.search);
const CAIXA = {
  x: parseFloat(p.get('x') ?? '0'),
  y: parseFloat(p.get('y') ?? '0'),
  largura: parseFloat(p.get('l') ?? '1')
};
const DESTINO = (p.get('nome') || 'trabalho-sem-nome-1') + '.webp';
const LARG = 924, ALT = 1155;

const L = document.getElementById('log');
const diz = t => { L.textContent += '\n' + t; };

const img = document.getElementById('fonte');
img.onload = async () => {
  const W = img.naturalWidth, H = img.naturalHeight;
  diz('imagem como o navegador ve: ' + W + ' x ' + H + '  (proporcao ' + (W / H).toFixed(3) + ')');
  if (Math.max(W, H) < 1400) diz('AVISO: origem pequena. O padrao pede 2000 px no lado maior.');

  let cw = Math.round(W * CAIXA.largura);
  let ch = Math.round(cw * ALT / LARG);                 /* 4:5 */
  if (ch > H) { ch = H; cw = Math.round(ch * LARG / ALT); }
  const cx = Math.max(0, Math.min(Math.round(W * CAIXA.x), W - cw));
  const cy = Math.max(0, Math.min(Math.round(H * CAIXA.y), H - ch));

  diz('recorte: ' + cw + ' x ' + ch + ' a partir de ' + cx + ',' + cy);
  diz('ampliacao ate 924 px: ' + (LARG / cw).toFixed(2) + 'x' + ((LARG / cw) > 1.5 ? '   (acima de 1,5x a foto amolece)' : ''));

  const m = document.getElementById('moldura');
  const escala = 300 / W;
  m.style.left = (cx * escala) + 'px';
  m.style.top = (cy * escala) + 'px';
  m.style.width = (cw * escala) + 'px';
  m.style.height = (ch * escala) + 'px';

  const c = document.getElementById('saida');
  c.width = LARG; c.height = ALT;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(img, cx, cy, cw, ch, 0, 0, LARG, ALT);

  const dados = c.toDataURL('image/webp', 0.9);
  const r = await fetch('/salvar', { method: 'POST', body: JSON.stringify({ nome: DESTINO, dados }) });
  diz((r.ok ? 'ok    ' : 'FALHA ') + DESTINO + '   ' + LARG + 'x' + ALT + '   ' + Math.round(dados.length * 0.75 / 1024) + ' kB');
};
img.onerror = () => diz('ERRO: nao achei /_entrada.jpg na raiz do projeto');
</script>
